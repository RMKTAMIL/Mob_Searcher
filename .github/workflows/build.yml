
name: MobileRAG Phase 2 Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and Validate MobileRAG
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
          cache-disabled: true

      - name: Verify and extract project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP="MobileRAG-v1_0-rc1-phase2-final-riskfix-fixed.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: Project ZIP not found: $ZIP"
            exit 1
          fi

          unzip -t "$ZIP"
          mkdir -p extracted
          unzip -q "$ZIP" -d extracted

          SETTINGS_FILE=$(find extracted \
            -type f -name settings.gradle.kts \
            -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle.kts not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: Android app Gradle file not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project found at: $PROJECT_DIR"

      - name: Build APK and run unit tests
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          gradle --no-daemon \
            assembleDebug \
            testDebugUnitTest

      - name: Verify APK exists
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: Debug APK was not generated"
            exit 1
          fi

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
          echo "APK generated successfully."
          ls -lh "$APK"

      - name: Check offline permission
        shell: bash
        run: |
          set -euo pipefail

          AAPT2=$(find "$ANDROID_HOME/build-tools" \
            -type f -name aapt2 | sort -V | tail -n 1)

          if [ -z "$AAPT2" ]; then
            echo "ERROR: aapt2 not found"
            exit 1
          fi

          "$AAPT2" dump permissions "$APK_PATH" \
            | tee permissions.txt

          if grep -q "android.permission.INTERNET" permissions.txt; then
            echo "ERROR: INTERNET permission detected"
            exit 1
          fi

          echo "Offline permission check passed."

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MobileRAG-Phase2-Debug-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MobileRAG-Unit-Test-Reports
          path: ${{ env.PROJECT_DIR }}/app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14
